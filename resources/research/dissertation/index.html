<title>Dissertation Figures</title>
<style>
:root { --ink:#0f172a; --muted:#475569; --faint:#64748b; --rule:#e2e8f0;
        --wash:#f8fafc; --sans:"Inter","Segoe UI",system-ui,sans-serif;
        --mono:"SF Mono",Consolas,Menlo,monospace; }
* { box-sizing:border-box; }
body { margin:0; background:var(--wash); color:var(--ink); font-family:var(--sans); }
header { background:linear-gradient(135deg,#8b5cf6,#3b82f6 45%,#06b6d4 78%,#10b981);
         color:#fff; padding:2.6rem 0; }
.wrap { max-width:1240px; margin:0 auto; padding-inline:24px; }
h1 { margin:0; font-size:clamp(1.7rem,4vw,2.6rem); font-weight:800; letter-spacing:-.03em; }
header p { margin:.6rem 0 0; opacity:.92; font-size:1rem; }
.count { display:inline-block; margin-top:1rem; background:rgba(255,255,255,.2);
         padding:.3em .9em; border-radius:0; font-size:.8rem; font-weight:700; }
.grid { display:grid; gap:1.6rem; padding-block:2.4rem; }
figure.g { margin:0; background:#fff; border:1px solid var(--rule);
           overflow:hidden; }
figure.g img { display:block; width:100%; height:auto; border-bottom:1px solid var(--rule); }
figcaption { display:flex; gap:1rem; align-items:flex-start; padding:1rem 1.2rem; }
figcaption b { font-size:1.5rem; font-weight:800; color:#3b82f6; line-height:1; }
figcaption strong { display:block; font-size:1rem; }
figcaption span { display:block; font-size:.78rem; color:var(--faint); margin:.15rem 0 .35rem;
                  text-transform:uppercase; letter-spacing:.07em; font-weight:700; }
figcaption code { font-family:var(--mono); font-size:.76rem; color:var(--muted); }
footer { padding-block:2rem 3rem; color:var(--faint); font-size:.84rem; }
</style>
</head>
