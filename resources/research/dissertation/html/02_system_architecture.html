<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>System architecture by layer</title>
<style>
:root {
  --ink:#0f172a; --body:#1e293b; --muted:#475569; --faint:#64748b;
  --rule:#e2e8f0; --hair:#f1f5f9; --paper:#ffffff; --wash:#f8fafc;
  --p1:#3b82f6; --p2:#10b981; --p3:#f43f5e;
  --amber:#f59e0b; --violet:#8b5cf6; --cyan:#06b6d4;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:"Inter","Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;
  --mono:"SF Mono",Consolas,Menlo,monospace;
}
* { box-sizing:border-box; }
body { margin:0; background:var(--paper); color:var(--body);
       font-family:var(--serif); font-size:17.5px; line-height:1.68;
       -webkit-font-smoothing:antialiased; }
.wrap { max-width:1180px; margin:0 auto; padding-inline:26px; }
.narrow { max-width:74ch; }
h1,h2,h3,h4,h5 { font-family:var(--sans); color:var(--ink); text-wrap:balance; margin:0;
                 letter-spacing:-.015em; }
h1 { font-size:clamp(2.3rem,6vw,4.2rem); font-weight:800; line-height:1.03;
     letter-spacing:-.035em; }
h2 { font-size:clamp(1.5rem,3.4vw,2.3rem); font-weight:800; }
h3 { font-size:1.28rem; font-weight:700; }
h4 { font-size:1.04rem; font-weight:700; }
p { margin:0 0 1.05rem; max-width:74ch; }
a { color:var(--p1); }
b, strong { color:var(--ink); font-weight:700; }
ul, ol { padding-left:1.3rem; max-width:74ch; }
li { margin-bottom:.5rem; }
li::marker { color:var(--faint); }
code { font-family:var(--mono); font-size:.86em; background:var(--wash);
       padding:.1em .38em; border-radius:0; color:var(--ink); }

/* masthead */
header { background:linear-gradient(135deg,#8b5cf6 0%,#3b82f6 42%,
          #06b6d4 78%,#10b981 100%); color:#fff; padding-block:4.4rem 3.4rem;
          margin-bottom:0; }
header h1 { color:#fff; max-width:20ch; }
header .eyebrow { color:rgba(255,255,255,.86); }
header .stand { color:rgba(255,255,255,.94); font-size:1.28rem; max-width:62ch;
                margin-top:1.3rem; }
.eyebrow { font-family:var(--sans); font-size:.76rem; font-weight:800;
           text-transform:uppercase; letter-spacing:.18em; margin:0 0 1rem; }
.byline { font-family:var(--sans); font-size:.82rem; color:rgba(255,255,255,.8);
          margin-top:2rem; display:flex; gap:1.4rem; flex-wrap:wrap; }
.byline span { display:inline-flex; gap:.42rem; align-items:center; }
.byline i { width:8px; height:8px; border-radius:0; background:#fff; opacity:.72; }

/* facts strip */
.facts { display:grid; grid-template-columns:repeat(6,1fr); gap:1px;
         background:var(--rule); border-bottom:1px solid var(--rule); }
.fact { background:var(--paper); padding:1.3rem .8rem; text-align:center;
        border-top:4px solid var(--hue); }
.fact b { display:block; font-family:var(--sans); font-size:1.72rem; font-weight:800;
          color:var(--ink); line-height:1.1; }
.fact span { display:block; font-family:var(--sans); font-size:.71rem; color:var(--faint);
             text-transform:uppercase; letter-spacing:.07em; margin-top:.3rem; }

/* contents */
.toc { padding-block:2.2rem; border-bottom:1px solid var(--rule); }
.toc ol { margin:0; padding:0; list-style:none; columns:3; column-gap:2.4rem; }
.toc li { margin:0 0 .44rem; font-family:var(--sans); font-size:.86rem; break-inside:avoid; }
.toc a { color:var(--body); text-decoration:none; }
.toc a:hover { color:var(--p1); }
.toc .act { font-weight:800; text-transform:uppercase; letter-spacing:.1em;
            font-size:.7rem; color:var(--hue); margin-top:1rem; display:block; }
.toc li:first-child .act { margin-top:0; }

/* act dividers */
.act-open { margin-top:4.5rem; padding-block:2.6rem 1.4rem;
            border-top:5px solid var(--hue); }
.act-num { font-family:var(--sans); font-size:.78rem; font-weight:800;
           text-transform:uppercase; letter-spacing:.2em; color:var(--hue); }
.act-open h2 { font-size:clamp(1.9rem,4.4vw,3rem); margin-top:.5rem; }
.act-open .stand { font-size:1.16rem; color:var(--muted); max-width:66ch; margin-top:.9rem; }

section { padding-block:2.2rem; }
section + section { border-top:1px solid var(--hair); }
.lede { color:var(--muted); font-size:1.06rem; margin-bottom:1.5rem; }

/* pull quote / key finding */
.finding { border-left:6px solid var(--hue,var(--amber)); background:var(--wash);
           padding:1.5rem 1.7rem; border-radius:0; margin-block:1.6rem; }
.finding p { margin:0; max-width:none; }
.finding p + p { margin-top:.8rem; }
.pull { font-family:var(--sans); font-size:clamp(1.15rem,2.3vw,1.6rem); font-weight:700;
        color:var(--ink); line-height:1.35; border-left:6px solid var(--hue,var(--p1));
        padding:.3rem 0 .3rem 1.5rem; margin-block:2.2rem; max-width:60ch;
        letter-spacing:-.015em; }

/* verdict cards */
.verdict { display:grid; grid-template-columns:repeat(3,1fr); gap:1.1rem; margin-top:1.6rem; }
.vcard { border:1px solid var(--rule); border-top:5px solid var(--hue);
         border-radius:0; padding:1.4rem; background:var(--wash); position:relative; }
.vrank { position:absolute; top:1.1rem; right:1.2rem; font-family:var(--sans);
         font-size:2.6rem; font-weight:800; color:var(--hue); opacity:.22; line-height:1; }
.vcard h3 { color:var(--hue); }
.one { font-size:.94rem; color:var(--muted); margin:.3rem 0 1rem; }
.vnums { display:grid; grid-template-columns:repeat(3,1fr); gap:.6rem;
         border-top:1px solid var(--rule); padding-top:.9rem; }
.vnums b { display:block; font-family:var(--sans); font-size:1.42rem; font-weight:800;
           color:var(--ink); }
.vnums span { display:block; font-family:var(--sans); font-size:.66rem; color:var(--faint);
              text-transform:uppercase; letter-spacing:.06em; }

/* tables */
.scroll { overflow-x:auto; margin-block:1.5rem; border-radius:0; }
table { border-collapse:collapse; width:100%; font-family:var(--sans); font-size:.87rem; }
caption { text-align:left; font-size:.82rem; color:var(--muted); padding-bottom:.7rem;
          max-width:80ch; }
th, td { padding:.62rem .8rem; text-align:right; border-bottom:1px solid var(--hair);
         white-space:nowrap; font-variant-numeric:tabular-nums; }
thead th { background:var(--ink); color:#fff; font-size:.71rem; text-transform:uppercase;
           letter-spacing:.06em; font-weight:700; border:0; }
thead th:first-child, tbody th { text-align:left; }
tbody th { font-weight:700; color:var(--ink); }
tbody tr:hover { background:var(--wash); }
td.num { font-weight:800; color:var(--faint); }
td:not([class]) { color:var(--body); }
.total th, .total td { border-top:2px solid var(--ink); font-weight:800; color:var(--ink); }
.grp td, .grp th { border-top:1px solid var(--rule); }
.grp-l { text-align:left; color:var(--faint); font-size:.76rem; }
.warn { color:#f97316; font-weight:700; }
.mono { font-family:var(--mono); font-size:.8rem; }
.dot { display:inline-block; width:9px; height:9px; border-radius:0; margin-right:.5rem; }
.pill { display:inline-block; font-size:.68rem; font-weight:800; padding:.22em .7em;
        border-radius:0; font-family:var(--sans); text-transform:uppercase;
        letter-spacing:.04em; }
.pill.yes { background:#f59e0b; color:#422006; }
.pill.no { background:var(--hair); color:var(--muted); }
.sev { display:inline-block; font-size:.68rem; font-weight:800; padding:.22em .7em;
       border-radius:0; background:var(--hue); color:#fff; font-family:var(--sans);
       text-transform:uppercase; letter-spacing:.04em; }

/* bars */
.bars { margin-top:1.3rem; }
.pair { display:grid; grid-template-columns:1fr 1fr; gap:2.6rem; margin-top:1.3rem; }
.bar { display:grid; grid-template-columns:7.4rem 1fr 4.4rem; align-items:center;
       gap:.85rem; margin-bottom:.5rem; font-family:var(--sans); font-size:.83rem; }
.bar-l { color:var(--muted); }
.bar-t { background:var(--hair); height:19px; border-radius:0; overflow:hidden; }
.bar-f { display:block; height:100%; border-radius:0; }
.bar-sub { display:block; height:100%; float:right; background:#fbbf24; }
.bar-v { text-align:right; font-weight:800; color:var(--ink); font-variant-numeric:tabular-nums; }

/* charts */
.chart { margin-block:1.5rem; }
.chart svg { width:100%; height:auto; display:block; overflow:visible; }
.cap { font-family:var(--sans); font-size:.79rem; color:var(--faint); margin-top:.9rem;
       max-width:84ch; }
.sw { display:inline-block; width:11px; height:11px; border-radius:0; vertical-align:-1px; }
.lbl { font-family:var(--sans); font-size:14.5px; font-weight:700; fill:#0f172a; }
.big-lbl { font-family:var(--sans); font-size:17px; font-weight:800; fill:#0f172a; }
.ax { font-family:var(--sans); font-size:12.5px; fill:#64748b; }
.tiny { font-family:var(--sans); font-size:11.5px; font-weight:700; fill:#475569; }
.mono-lbl { font-family:var(--mono); font-size:11.5px; fill:#0f172a; }
.tbl-head { font-family:var(--sans); font-size:14px; font-weight:800; }
.tbl-count { font-family:var(--sans); font-size:11px; font-weight:700; opacity:.85; }

/* distribution */
.dist-wrap { margin-top:1.3rem; }
.dist { display:grid; grid-template-columns:7.4rem 1fr; align-items:center; gap:.85rem;
        margin-bottom:.55rem; font-family:var(--sans); font-size:.83rem; }
.dist-l { color:var(--muted); }
.dist-t { display:flex; height:34px; border-radius:0; overflow:hidden; }
.seg { display:grid; place-items:center; color:#fff; font-size:.74rem; font-weight:800; }
.key { display:flex; flex-wrap:wrap; align-items:center; gap:.8rem; margin-top:1rem;
       font-family:var(--sans); font-size:.76rem; color:var(--faint); }
.key span { display:inline-flex; align-items:center; gap:.36rem; }
.key i { width:13px; height:13px; border-radius:0; display:inline-block; }
.key em { font-style:normal; }

/* matrix */
.matrix { margin-top:1.5rem; font-family:var(--sans); }
.mx-row { display:grid; grid-template-columns:8rem 1fr 1fr; gap:1px; background:var(--rule); }
.mx-head { background:none; }
.mx-h { font-size:.72rem; font-weight:800; text-transform:uppercase; letter-spacing:.09em;
        color:var(--muted); padding:.5rem 1rem; }
.mx-lab { display:flex; align-items:center; font-size:.72rem; font-weight:800;
          text-transform:uppercase; letter-spacing:.09em; color:var(--muted);
          background:var(--paper); padding-right:1rem; }
.mx-cell { background:var(--paper); padding:1.3rem; border-top:4px solid var(--hue); }
.mx-cell b { display:block; font-size:2.4rem; font-weight:800; color:var(--hue);
             line-height:1; margin:.15rem 0 .45rem; }
.mx-cell h4 { color:var(--ink); margin-bottom:.3rem; }
.tag { font-family:var(--sans); font-size:.68rem; font-weight:800; text-transform:uppercase;
       letter-spacing:.1em; color:var(--faint); margin:0; }
.blurb { font-size:.88rem; color:var(--faint); margin:0 0 .9rem; }

/* quadrant + story + threat cards */
.quads { display:grid; grid-template-columns:1fr 1fr; gap:1.1rem; margin-top:1.5rem; }
.quad { border:1px solid var(--rule); border-top:4px solid var(--hue);
        border-radius:0; padding:1.3rem; }
.quad h4 { margin-bottom:.25rem; }
.flip { display:inline-block; margin-top:.6rem; font-family:var(--sans); font-size:.7rem;
        font-weight:800; text-transform:uppercase; letter-spacing:.06em;
        background:#f59e0b; color:#422006; padding:.28em .75em; border-radius:0; }
.stories { display:grid; grid-template-columns:repeat(3,1fr); gap:1.1rem; margin-top:1.5rem; }
.story { border:1px solid var(--rule); border-left:5px solid var(--hue); border-radius:0;
         padding:1.2rem 1.3rem; background:var(--wash); }
.story h4 { color:var(--hue); margin-bottom:.5rem; }
.story p { font-size:.9rem; margin:0; }

.threats { display:grid; gap:1rem; margin-top:1.5rem; }
.threat { border:1px solid var(--rule); border-left:6px solid var(--rule);
          border-radius:0; padding:1.4rem 1.6rem; }
.threat.material { border-left-color:#f43f5e; background:#fff5f6; }
.threat.moderate { border-left-color:#f59e0b; background:#fffbeb; }
.threat.minor { border-left-color:#64748b; background:var(--wash); }
.threat.material .tag { color:#f43f5e; }
.threat.moderate .tag { color:#f97316; }
.threat h4 { margin:.3rem 0 .7rem; }
.threat p { font-size:.93rem; margin-bottom:.65rem; max-width:82ch; }
.threat p:last-child { margin-bottom:0; }
.defence { border-top:1px dashed var(--rule); padding-top:.75rem; }

/* judge bands */
.bands { display:grid; gap:.6rem; margin-top:1.4rem; }
.band { display:grid; grid-template-columns:3.2rem 1fr; align-items:center; gap:1rem;
        border:1px solid var(--rule); border-left:5px solid var(--hue);
        border-radius:0; padding:.85rem 1.2rem; }
.bnum { font-family:var(--sans); font-size:1.9rem; font-weight:800; color:var(--hue);
        text-align:center; line-height:1; }
.band h4 { font-size:.98rem; }
.band .blurb { margin:.15rem 0 0; }

/* heatmaps */
.heat { margin-top:1.3rem; font-family:var(--sans); font-size:.82rem; }
.hm-row { display:grid; grid-template-columns:7.6rem 5.6rem repeat(3,1fr); gap:3px;
          margin-bottom:3px; }
.heat5 .hm-row { grid-template-columns:7.6rem repeat(5,1fr); }
.hm-head .hm-h, .hm-head .hm-n { font-size:.68rem; text-transform:uppercase;
        letter-spacing:.06em; color:var(--faint); display:grid; place-items:center;
        padding-bottom:.35rem; font-weight:800; }
.hm-r { display:flex; align-items:center; color:var(--muted); }
.hm-n { display:grid; place-items:center; color:var(--faint); font-size:.74rem;
        font-weight:700; }
.hm-c { display:grid; place-items:center; padding:.55rem 0; font-weight:800;
        border-radius:0; font-variant-numeric:tabular-nums; }
.hm-c.empty { background:var(--wash); color:var(--faint); font-weight:400; }
.sm { display:none; }
.hm-head b { font-weight:800; }

/* contingency */
.cards3 { display:grid; grid-template-columns:repeat(3,1fr); gap:1.1rem; margin-top:1.5rem; }
.ccard { border:1px solid var(--rule); border-top:4px solid var(--hue); border-radius:0;
         padding:1.3rem; }
.ccard h4 { color:var(--hue); margin-bottom:.3rem; }
.csplit { display:grid; grid-template-columns:1fr 1fr; gap:1rem; margin:1rem 0 .7rem; }
.csplit b { display:block; font-family:var(--sans); font-size:1.85rem; font-weight:800;
            line-height:1.1; }
.csplit b.good { color:#10b981; }
.csplit b.bad { color:#f43f5e; }
.csplit span { display:block; font-family:var(--sans); font-size:.7rem; color:var(--faint); }

/* timeline list */
.tl { border-left:3px solid var(--rule); margin-top:1.5rem; padding-left:0; list-style:none; }
.tl li { position:relative; padding:0 0 1.5rem 2rem; margin:0; }
.tl li::before { content:""; position:absolute; left:-9px; top:.45rem; width:15px;
                 height:15px; border-radius:0; background:var(--hue,var(--p1));
                 border:3px solid var(--paper); }
.tl h4 { margin-bottom:.25rem; }
.tl .when { font-family:var(--mono); font-size:.76rem; color:var(--faint);
            display:block; margin-bottom:.2rem; }
.tl p { font-size:.93rem; margin:0; }

footer { background:var(--ink); color:rgba(255,255,255,.76); margin-top:4rem;
         padding-block:2.6rem 3.4rem; font-family:var(--sans); font-size:.84rem; }
footer b { color:#fff; }
footer code { background:rgba(255,255,255,.1); color:#fff; }
footer p { max-width:82ch; }

@media (max-width:960px) {
  .facts { grid-template-columns:repeat(3,1fr); }
  .verdict, .quads, .pair, .stories, .cards3 { grid-template-columns:1fr; }
  .toc ol { columns:2; }
}
@media (max-width:600px) {
  body { font-size:16.5px; }
  .facts { grid-template-columns:repeat(2,1fr); }
  .bar, .dist { grid-template-columns:5.4rem 1fr 3.4rem; }
  .dist { grid-template-columns:5.4rem 1fr; }
  .hm-row { grid-template-columns:4.6rem 2.6rem repeat(3,1fr); }
  .heat5 .hm-row { grid-template-columns:4.6rem repeat(5,1fr); }
  .hm-r, .hm-c { font-size:.74rem; }
  .lg { display:none; }
  .sm { display:inline; }
  .toc ol { columns:1; }
  .mx-row { grid-template-columns:1fr; }
  .mx-lab { padding:.7rem 0 0; }
  .csplit { grid-template-columns:1fr; }
  .band { grid-template-columns:2.4rem 1fr; }
}
@media print { section, .chart, .threat { break-inside:avoid; } header { color:#000; } }

body { background:#ffffff; margin:0; padding:0; }
.fig { width:1240px; padding:34px 38px 30px; background:#ffffff; }
.fig > h3.fig-title { font-family:var(--sans); font-size:1.12rem; font-weight:800;
  color:var(--ink); margin:0 0 .3rem; letter-spacing:-.015em; }
.fig > p.fig-sub { font-family:var(--sans); font-size:.82rem; color:var(--faint);
  margin:0 0 1.3rem; text-transform:uppercase; letter-spacing:.09em; font-weight:700; }
.fig .chart, .fig .bars, .fig .heat, .fig .matrix, .fig .bands,
.fig .verdict, .fig .quads, .fig .cards3, .fig .pair { margin-top:0; }
.fig .cap { margin-top:1rem; }
</style>
</head>
