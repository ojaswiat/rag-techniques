    - generic [ref=f2e609]:
      - heading "Why the structural pipeline trails" [level=2] [ref=f2e610]
      - paragraph [ref=f2e611]: A result this lopsided invites the suspicion that something is broken. The numbers say otherwise.
      - list [ref=f2e612]:
        - listitem [ref=f2e613]: "It retrieves, it just retrieves the wrong nodes. Hit rate is 20.7% against 84.0% for P2 BM25: on most questions the supporting node is never returned at all."
        - listitem [ref=f2e614]: Answer quality tracks retrieval almost exactly. Recall of 0.181 against 0.706 produces a judge mean of 1.88 against 4.02. When the evidence is absent the answering model mostly declines rather than fabricating.
        - listitem [ref=f2e615]: Its best quadrant is the inferential one. Tree traversal descends by comparing the query against summaries, and a summary is exactly the artefact from which a specific figure has been compressed away. On a benchmark dominated by extraction that is fatal. It would not be on a benchmark of thematic questions, which is the use this structure was designed for.
    - generic [ref=f2e616]:
      - heading "What would weaken these findings" [level=2] [ref=f2e617]
      - list [ref=f2e618]:
        - listitem [ref=f2e619]: One run per cell. Every call is temperature zero and each cell runs once, so these intervals describe variation across questions, not run to run variance. Nothing here estimates the latter.
        - listitem [ref=f2e620]: The judge gate is a pragmatic check. 86.7% concordance on 60 outputs is evidence the judge is usable, not proof it is correct, and it is cross-model concordance rather than external human validation.
        - listitem [ref=f2e621]: The answer key needed correcting. The question generator returned whole section citation lists on 24 of 100 questions, making full recall arithmetically unreachable on those rows. Citations were re-derived to the minimal set that demonstrably yields the answer, and one answer key was rewritten. Both corrections replay from the repository.
        - listitem [ref=f2e622]: Build tokens are incomplete. Two filings were built before the build log recorded token counts, so the structural token figure is a floor over 11 of 13 filings.
        - listitem [ref=f2e623]: Corpus artefacts survive. A handful of nodes carry identifiers where a figure belongs, and some carry unescaped HTML entities. All three pipelines index the identical corpus, so none is advantaged.
