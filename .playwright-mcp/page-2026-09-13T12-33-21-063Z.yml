        - paragraph [ref=f3e110]: Act 0 · Prologue
        - heading "A reflex on trial" [level=2] [ref=f3e111]
        - paragraph [ref=f3e112]: Vector search is the default answer to almost every retrieval question. This study asked whether that reflex is earned.
      - generic [ref=f3e113]:
        - paragraph [ref=f3e114]: Ask a room of engineers how to search a document. Most will say embeddings.
        - paragraph [ref=f3e115]: Dense vector retrieval has become the reflex answer. It is what the tutorials teach and what the vendors sell.
        - paragraph [ref=f3e116]: But a 1994 statistical ranking function called BM25 still sits in every search engine built. It has no model, no training and no embedding.
        - paragraph [ref=f3e117]: And a third idea exists. Build a summary tree over the document, then walk down it. Structure instead of similarity.
        - paragraph [ref=f3e118]: This study put all three on the same 900 questions and measured what happened.
      - paragraph [ref=f3e119]: Three retrieval paradigms. One corpus. One answering model. One judge. Nine hundred scored cells, and no place to hide.
      - heading "The verdict, before the evidence" [level=3] [ref=f3e120]
      - paragraph [ref=f3e121]: Publishable work states its finding first, then earns it. Here is the finding.
