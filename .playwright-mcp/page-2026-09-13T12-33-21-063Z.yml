      - generic [ref=f3e165]:
        - paragraph [ref=f3e166]: 1. The reflex is not earned, but it is not wrong either. Semantic and statistical retrieval are statistically indistinguishable here. The paired difference is -0.160, interval [-0.340, +0.013]. It spans zero.
        - paragraph [ref=f3e167]: 2. The average hides a real split. BM25 wins the implicit-text quadrant outright. The vector pipeline leads on implicit tables. Pooled, they cancel.
        - paragraph [ref=f3e168]: 3. Structure lost, and lost expensively. The summary tree trails by about two judge points. It also took 10.6 hours and 2.5 million tokens to build.
      - paragraph [ref=f3e169]: A 32-year-old algorithm with no model matched a modern embedding stack. It also built its index in under one second.
      - paragraph [ref=f3e170]: The rest of this document is how that result was produced. It covers what nearly broke it, and what it lets you claim.
    - generic [ref=f3e171]:
      - generic [ref=f3e172]:
        - paragraph [ref=f3e173]: Act I · The Design
        - heading "Building a fair fight" [level=2] [ref=f3e174]
        - paragraph [ref=f3e175]: A comparison is only worth running if the thing being compared is the only thing allowed to vary. Most of the design is about holding everything else still.
      - generic [ref=f3e176]:
        - paragraph [ref=f3e177]: The research question is narrow on purpose.
        - paragraph [ref=f3e178]: Does the way a retriever is built change how well a language model answers questions about an annual report?
        - paragraph [ref=f3e179]: To answer it, three paradigms index the identical corpus. They answer the identical questions through the identical model. They are graded by the identical judge.
        - paragraph [ref=f3e180]: Anything that differs between them is the paradigm. Nothing else is permitted to move.
      - heading "The three contenders" [level=3] [ref=f3e181]
      - generic [ref=f3e182]:
        - generic [ref=f3e183]:
          - heading "P1 Vector" [level=3] [ref=f3e184]
          - paragraph [ref=f3e185]: Matches on meaning.
          - paragraph [ref=f3e186]: Dense embeddings in ChromaDB, reranked by a local cross-encoder.
        - generic [ref=f3e187]:
          - heading "P2 BM25" [level=3] [ref=f3e188]
          - paragraph [ref=f3e189]: Matches on terms and their rarity.
          - paragraph [ref=f3e190]: rank_bm25 over the same nodes. No model of any kind.
        - generic [ref=f3e191]:
          - heading "P3 Structural" [level=3] [ref=f3e192]
          - paragraph [ref=f3e193]: Matches on position in a hierarchy.
          - paragraph [ref=f3e194]: A LlamaIndex summary tree per filing, traversed by embedding.
      - heading "What is held constant" [level=3] [ref=f3e195]
      - list [ref=f3e196]:
        - listitem [ref=f3e197]: The corpus. All three index the same 18,297 nodes from the same 13 filings.
        - listitem [ref=f3e198]: The questions. All three answer the same 100 questions at three depths. That gives 900 cells.
        - listitem [ref=f3e199]: The answering model. One model writes every answer. Differences trace back to retrieval alone.
        - listitem [ref=f3e200]: The grader. One judge, one rubric, with a fingerprint stored per row.
        - listitem [ref=f3e201]: What a pipeline never sees. Only the question and its own retrieved nodes. No ground truth, no hints, no metadata filter.
