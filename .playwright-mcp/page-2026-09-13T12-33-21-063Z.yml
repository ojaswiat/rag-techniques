        - heading "Fifteen bugs, thirty-eight deviations" [level=2] [ref=f3e1027]
        - paragraph [ref=f3e1028]: Nothing in this project went to plan. That is not a confession, it is the methodology chapter. Every departure is logged with what was proposed, what changed, and why.
      - generic [ref=f3e1029]:
        - paragraph [ref=f3e1030]: Research code fails in a specific way. It does not crash. It produces a number.
