      - list [ref=f3e986]:
        - listitem [ref=f3e987]:
          - generic [ref=f3e988]: Week 1
          - heading "Phase 1 · The rails" [level=4] [ref=f3e989]
          - paragraph [ref=f3e990]: Five SQLite tables, three provider clients, one factory. Retry with backoff, a semaphore capped at five workers, and a throttle flag on every loop.
          - paragraph [ref=f3e991]: Nothing here calls a model in anger. It builds the things that keep the project at zero cost and crash-resilient.
        - listitem [ref=f3e992]:
          - generic [ref=f3e993]: Weeks 1 to 3
          - heading "Phase 2 · Turning filings into nodes" [level=4] [ref=f3e994]
          - paragraph [ref=f3e995]: Thirteen 10-K filings pulled from SEC EDGAR. Parsed by LlamaParse in atomic-table mode, so no table is ever bisected.
          - paragraph [ref=f3e996]: "Result: 18,297 nodes, each with a stable id. Every downstream metric keys off that id, so correctness here is load-bearing."
        - listitem [ref=f3e997]:
          - generic [ref=f3e998]: Weeks 3 to 4
          - heading "Phase 3 · The expensive index" [level=4] [ref=f3e999]
          - paragraph [ref=f3e1000]: The only index allowed to call a model. One summary tree per filing, built once and cached forever.
          - paragraph [ref=f3e1001]: It took 10.6 hours and roughly 2.5 million tokens. It became the longest phase in the project by wall clock.
        - listitem [ref=f3e1002]:
          - generic [ref=f3e1003]: Weeks 4 to 6
          - heading "Phase 4 · Making the questions" [level=4] [ref=f3e1004]
          - paragraph [ref=f3e1005]: A generator proposes a question, an answer and its evidence. A critic from a different family tries to verify it, blind.
          - paragraph [ref=f3e1006]: The critic gets a search tool over the whole filing. It never sees the proposed answer. A deterministic code check compares what both found.
        - listitem [ref=f3e1007]:
          - generic [ref=f3e1008]: Weeks 5 to 7
          - heading "Phase 5 · Three retrievers, one interface" [level=4] [ref=f3e1009]
          - paragraph [ref=f3e1010]: All three implement the same abstract class. That is what makes the swap clean, and the comparison fair.
          - paragraph [ref=f3e1011]: P2 was held to pure statistics deliberately. LlamaIndex offers a keyword index that calls an LLM, which would have destroyed the contrast.
        - listitem [ref=f3e1012]:
          - generic [ref=f3e1013]: Weeks 6 to 8
          - heading "Phase 6 · The gate" [level=4] [ref=f3e1014]
          - paragraph [ref=f3e1015]: A hard stop. No full run was permitted until the judge proved itself on sixty held-out outputs.
        - listitem [ref=f3e1016]:
          - generic [ref=f3e1017]: Weeks 7 to 10
          - heading "Phase 7 · The run" [level=4] [ref=f3e1018]
          - paragraph [ref=f3e1019]: Nine hundred cells, once each, at temperature zero. Resumable after every committed row.
