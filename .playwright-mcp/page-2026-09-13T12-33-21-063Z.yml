        - paragraph [ref=f3e1032]: Four of the fifteen bugs below were exactly that shape. Each would have invalidated the comparison while leaving every test green.
        - paragraph [ref=f3e1033]: These fifteen are not every bug. The defect log records only major or load-bearing failures, not the routine nits caught in review.
        - paragraph [ref=f3e1034]: Ordinary fixes went to the operations log instead. What follows is the subset that changed a decision, a metric, or the design.
