          - paragraph [ref=f10e1657]: What the data shows. Every cell was executed once at temperature 0, with each model pinned to a single upstream host so that quantisation could not vary between calls. The confidence intervals describe variation across questions.
          - paragraph [ref=f10e1658]: "How to put it in the write-up. State plainly that the intervals are question-level, not run-level, and that the design trades repeated sampling for breadth: 900 distinct cells rather than a smaller matrix sampled repeatedly. Temperature 0 and host pinning are what make a single run defensible; say both."
