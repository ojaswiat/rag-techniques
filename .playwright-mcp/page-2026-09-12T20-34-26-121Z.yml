          - heading "The judge gate measures concordance, not human agreement" [level=3] [ref=f10e1661]
          - paragraph [ref=f10e1662]: What the data shows. The gate compares the Judge against a reference scoring of the same 60 outputs produced under a blinding protocol, not against an independent human annotator. It reads 52 of 60 exact (86.7%), with every disagreement confined to a single band.
          - paragraph [ref=f10e1663]: "How to put it in the write-up. Call it cross-scorer concordance throughout and never call it human validation. The defensible claim is that the Judge is consistent with an independent application of the same published rubric under blinding, which is what the gate actually tests. Cite the blinding protocol: pipeline identity and citation evidence were withheld from the reference scorer."
