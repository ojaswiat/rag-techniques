    - generic [ref=f10e88]:
      - paragraph [ref=f10e89]: I. What was measured
      - heading "The question and the design" [level=2] [ref=f10e90]
      - paragraph [ref=f10e91]: One question, asked three ways.
      - paragraph [ref=f10e93]: Does the way a retriever is built change how well a language model can answer questions about a company's annual report? Three retrieval paradigms index the identical corpus and are asked the identical questions through the identical answering model. Anything that differs between them is the paradigm, because nothing else is allowed to vary.
      - generic [ref=f10e94]:
        - generic [ref=f10e96]:
          - generic [ref=f10e97]: "1"
          - generic [ref=f10e98]:
            - heading "P1 Vector" [level=3] [ref=f10e99]
            - paragraph [ref=f10e100]: Semantic. Dense embeddings in ChromaDB with fastembed, reranked by a local cross-encoder. Matches on meaning.
        - generic [ref=f10e102]:
          - generic [ref=f10e103]: "2"
          - generic [ref=f10e104]:
            - heading "P2 BM25" [level=3] [ref=f10e105]
            - paragraph [ref=f10e106]: Statistical. rank_bm25 over the same nodes, no model of any kind. Matches on terms and their rarity.
        - generic [ref=f10e108]:
          - generic [ref=f10e109]: "3"
          - generic [ref=f10e110]:
            - heading "P3 Structural" [level=3] [ref=f10e111]
            - paragraph [ref=f10e112]: A LlamaIndex summary tree per filing, traversed by comparing the query against node summaries. Matches on position in a hierarchy.
      - heading "What is held constant" [level=3] [ref=f10e113]
      - list [ref=f10e114]:
        - listitem [ref=f10e115]: The corpus. All three index the same 18,297 nodes from the same 13 filings, produced by one parsing and splitting pass.
        - listitem [ref=f10e116]: The questions. All three answer the same 100 questions at the same three depths, giving 900 cells.
        - listitem [ref=f10e117]: The answering model. One model writes every answer, so differences in answer quality trace back to what each retriever handed it.
        - listitem [ref=f10e118]: The grader. One judge scores every answer against the same rubric, with a fingerprint recorded per row so a score can be tied to the rubric in force when it was written.
        - listitem [ref=f10e119]: What a pipeline is never shown. The question and its own retrieved nodes, and nothing else. No ground truth, no exemplars, no hint about where the answer lives, and no metadata pre-filter.
