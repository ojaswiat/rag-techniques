      - list [ref=f10e1467]:
        - listitem [ref=f10e1468]: "It retrieves, it just retrieves the wrong nodes. Hit rate is 20.7% against 84.0% for P2 BM25: on most questions the supporting node is never returned at all. Diversity is the highest of the three, so this is not a retriever stuck returning the same nodes regardless of the query."
        - listitem [ref=f10e1469]: It is not landing near the evidence and picking the wrong paragraph. Its median returned node sits at 0.596 of the way through a filing whose evidence sits at 0.354, and its median miss is 29.2% of the filing against 3.0% for P2 BM25. It is landing in the wrong part of the document, biased late.
        - listitem [ref=f10e1470]: Tree traversal descends by comparing the query against summaries, and a summary is exactly the artefact from which a specific figure has been compressed away. On a benchmark dominated by extraction that is fatal. It would not be on a benchmark of thematic questions, which is the use this structure was designed for.
        - listitem [ref=f10e1471]: Its relative best quadrant is the inferential one. Where the answer appears verbatim nowhere, summarisation loses least, and the gap narrows.
