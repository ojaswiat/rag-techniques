      - paragraph [ref=f10e1640]: VI. Validity
      - heading "Threats to validity, and how to answer them" [level=2] [ref=f10e1641]
      - paragraph [ref=f10e1642]: Every limitation an examiner could raise, what the data actually shows about it, and the argument to make. Ordered by how much work each one needs in the write-up.
