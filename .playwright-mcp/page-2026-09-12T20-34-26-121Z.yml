          - paragraph [ref=f10e1668]: "How to put it in the write-up. Argue it on mechanism, not on trust. The retention rule is mechanical, uniform, and was applied blind to every pipeline's output, so nothing could be tuned toward a preferred result; and the repair replays from the pre-repair backup to reproduce the current database exactly. Note also that it was not common-mode: it changed the vector against BM25 ordering on precision, which is precisely why leaving it in place and disclosing it would not have been defensible."
