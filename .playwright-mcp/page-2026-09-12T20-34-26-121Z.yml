    - generic [ref=f10e1699]:
      - heading "What would weaken these findings" [level=2] [ref=f10e1700]
      - paragraph [ref=f10e1701]: The findings above would not survive all of these equally. Stated plainly, so the claims can be scoped to match.
      - list [ref=f10e1702]:
        - listitem [ref=f10e1703]: A different question mix would move the vector against BM25 result. This is the most fragile finding on the page. The two are separated inside quadrants and cancel over the pooled set, so the mix of question types is doing the work. State the mix whenever the null result is quoted.
        - listitem [ref=f10e1704]: A thematic or summarisation benchmark would move the structural result. Summary trees compress detail away, which is fatal for extraction and may be helpful for synthesis. Nothing here tests synthesis over a whole filing.
        - listitem [ref=f10e1705]: A different answering model could change the leakage floor. A smaller model with less memorised knowledge of these companies would leak less and would widen the measured gap; a larger one would narrow it.
        - listitem [ref=f10e1706]: Nothing here would move by adding runs. The gaps between structural and the other two span roughly two judge points with intervals hundreds of times wider than any plausible run-to-run noise at temperature 0.
        - listitem [ref=f10e1707]: Nothing here would move by adding depth within this sweep. The ordering is identical at every one of the three depths.
