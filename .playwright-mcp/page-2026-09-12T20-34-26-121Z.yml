      - generic [ref=f10e1365]:
        - paragraph [ref=f10e1366]: Retrieval, not generation, is what separates these architectures. When the evidence node is returned, every pipeline passes at a similar high rate. When it is not, every pipeline fails at a similar high rate. The answering model is the same in all six of those cells, so the difference between architectures is entirely a difference in what they hand it.
        - paragraph [ref=f10e1367]: 19 of the 900 cells break that rule, scoring 4 or 5 with no evidence node retrieved at all. Those were answered from the answering model's own knowledge of these companies rather than from the filing, and 16 of them belong to the structural pipeline. This is a floor on parametric leakage, and it flatters the weakest pipeline rather than the strongest.
      - paragraph [ref=f10e1368]: The direction of that leakage matters for the conclusion. A pipeline that retrieves nothing useful leaves the model free to answer from memory, so leakage raises the floor under the worst performer. The measured gap between structural and the other two is therefore a lower bound on the true gap.
