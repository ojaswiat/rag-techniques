          - paragraph [ref=f10e1647]: What the data shows. Median per-cell latency is 3.53 s , 3.54 s , 3.71 s, a spread of 0.18 s across all three. The means differ more, but they are pulled by a small number of very slow calls against a shared hosted provider, not by retrieval work done locally.
          - paragraph [ref=f10e1648]: "How to put it in the write-up. Report query latency as a null result and say why: every cell routes through the same answering model, so the shared network call dominates the measurement and local retrieval time is lost inside it. The efficiency claim rests on index build cost and on tokens per query, which are measured cleanly and do separate the paradigms."
