          - paragraph [ref=f10e1652]: What the data shows. 19 of the 900 cells scored 4 or 5 while retrieving no ground-truth node at all, 16 of them in the structural pipeline. Those answers came from the answering model's own knowledge of these companies, not from the filing.
          - paragraph [ref=f10e1653]: "How to put it in the write-up. Disclose it as a floor on parametric leakage and note the direction: it inflates the weakest pipeline's score, because a pipeline that retrieves nothing useful leaves the model free to answer from memory. The measured gap between structural and the other two is therefore a lower bound on the true gap, not an exaggeration of it."
        - generic [ref=f10e1654]:
